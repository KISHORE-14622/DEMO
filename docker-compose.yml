services:

  # ─── Node.js API ──────────────────────────────────────────────────────────
  node-api:
    build:
      context: ./node-api
      dockerfile: Dockerfile
    container_name: node-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── React Frontend (Nginx serving built React bundle) ───────────────────
  react-app:
    build:
      context: ./react-app
      dockerfile: Dockerfile
    container_name: react-app
    ports:
      - "3000:80"
    depends_on:
      node-api:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # ─── SFTP Server ──────────────────────────────────────────────────────────
  sftp:
    image: atmoz/sftp:latest
    container_name: sftp-server
    ports:
      - "2222:22"
    volumes:
      - ./sftp/users.conf:/etc/sftp/users.conf:ro
      - sftp-data:/home/sftpuser/upload
    networks:
      - app-network
    restart: unless-stopped

  # ─── Jenkins CI/CD Server ─────────────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xmx2048m

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-html:/usr/share/nginx/html
    depends_on:
      - node-api
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# ─── Named Volumes ─────────────────────────────────────────────────────────
volumes:
  jenkins_data:
    driver: local
  sftp-data:
    driver: local
  nginx-html:
    driver: local

# ─── Networks ──────────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge
    name: demo-jenkins_app-network
